<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Ventas</title>
<link rel="stylesheet" href="styles.css">
<script defer src="ventas.js"></script>
</head>
<body>
    <!-- Barra de Navegación -->
    <nav>
        <ul>
            <li><a href="calculadora.html">Calculadora</a></li>
            <li><a href="ventas.html">Ventas</a></li>
            <li><a href="historial.html">Historial</a></li>
        </ul>
    </nav>

    <h1>Registro de Ventas</h1>
    
    <!-- Barra de búsqueda -->
    <div id="search-container">
        <select id="search-type">
            <option value="=">=</option>
            <option value="Menor">Menor</option>
            <option value="Mayor">Mayor</option>
        </select>
        <input type="number" id="search-monto" placeholder="Ingrese monto...">
        <button id="search-btn">Buscar</button>
    </div>

    <!-- Barra de filtrado -->
    <div id="filter-container">
        <select id="payment-method-type">
            <option value="Efectivo">Efectivo</option>
            <option value="Transferencia">Transferencia</option>
            <option value="Tarjeta">Tarjeta</option>
        </select>
        <button id="filter-btn">Filtrar</button>
        <button id="clean-btn">X</button>
    </div>

    <table id="sales-table">
        <thead>
            <tr>
                <th>Método de Pago</th>
                <th>Importe</th>
                <th>Producto</th>
                <th>Fecha</th>
                <th>Hora</th>
            </tr>
        </thead>
        <tbody id="sales-body"></tbody>
    </table>

    <div id="total-container">
        <strong>Efectivo: $<span id="total-cash">0</span></strong><br>
        <strong>Transferencia: $<span id="total-transfer">0</span></strong><br>
        <strong>Tarjeta: $<span id="total-card">0</span></strong><br><br>
        <strong>Total: $<span id="total-sales">0</span></strong><br>
    </div>

    <button id="edit-sales">Editar</button>
    <button id="delete-sales">Eliminar</button>
    <button id="close-sales">Cerrar Caja</button>

    <div id="download-message"></div>
</body>
<!-- Ventana Modal para Editar Venta -->
<div id="edit-modal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Editar Venta</h2>
        <label>Producto:</label>
        <input type="text" id="edit-product">
        <br>
        <br>
        <label>Importe:</label>
        <input type="number" id="edit-value">
        <br>
        <br>
        <label>Método de Pago:</label>
        <select id="edit-method">
            <option value="Efectivo">Efectivo</option>
            <option value="Transferencia">Transferencia</option>
            <option value="Tarjeta">Tarjeta</option>
        </select>
        <br>
        <button id="save-edit">Guardar Cambios</button>
    </div>
</div>
</html>
