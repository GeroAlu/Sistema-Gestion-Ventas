<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Cambio</title>
<link rel="stylesheet" href="styles.css">
<script defer src="calculadora.js"></script>
</head>
<body>
    <!-- Barra de Navegación -->
    <nav>
        <ul>
            <li><a href="calculadora.html">Calculadora</a></li>
            <li><a href="ventas.html">Ventas</a></li>
            <li><a href="historial.html">Historial</a></li>
        </ul>
    </nav>

    <h1>Calculadora de Cambio</h1>
    <form id="calculator-form">
        <div class="input-group">
            <label>Producto:</label>
            <input type="text" id="product-name" placeholder="Ingrese el nombre del producto">
        </div>

        <div class="input-group">
            <label for="payment-method">Método de Pago:</label>
            <select id="payment-method">
                <option value="Efectivo">Efectivo</option>
                <option value="Transferencia">Transferencia</option>
                <option value="Tarjeta">Tarjeta</option>
            </select>
        </div>

        <div class="input-group">
            <label>Valor del producto:</label>
            <input type="number" id="product-value" placeholder="0" required>
        </div>

        <div class="input-group">
            <label>Cliente paga con:</label>
            <input type="number" id="payment-amount" placeholder="0">
        </div>

        <div class="input-group">
            <label>Vuelto:</label>
            <input type="text" id="change" placeholder="0" readonly>
        </div>

        <!-- Detalle del cambio en billetes -->
        <div id="change-details"></div>

        <button type="button" id="calculate-btn">Calcular Cambio</button>
        <button type="button" id="register-btn">Registrar Venta</button>
    </form>
</body>
</html>
